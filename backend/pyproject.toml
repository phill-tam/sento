[project]
name = "backend"
version = "0.1.0"
description = "Sento — sentence-generation"
# No `readme` field on purpose. It pointed at ../README.md, which
# hatchling rejects outright ("Readme path must be within the project
# directory"), failing `uv run` and so the Render start command. This
# package is never published — the field bought nothing and cost the
# deploy.
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.120.2",
    "fastapi[standard]>=0.140.13",
    "google-genai>=2.17.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    # starlette.testclient (imported via fastapi.testclient in
    # tests/conftest.py) now prefers httpx2 over httpx, warning on the
    # old path — httpx itself stays in the tree regardless, pulled in
    # transitively by anthropic/google-genai/fastapi[standard] for their
    # own HTTP calls, so this is a second client used only by tests.
    "httpx2>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

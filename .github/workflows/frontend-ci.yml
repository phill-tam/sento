name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  frontend-lint-and-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # frontend/tests/, not frontend/src/ — tests live in their own tree,
      # the same way backend/tests/ does, and vite.config.js pins Vitest's
      # `include` to match.
      #
      # Both patterns are needed and neither is redundant: @actions/glob
      # does not do brace expansion, so a single '*.test.{js,jsx}' would
      # match nothing at all — the step would skip and the run would go
      # green having executed zero tests.
      - name: Run tests
        if: hashFiles('frontend/tests/**/*.test.js', 'frontend/tests/**/*.test.jsx') != ''
        run: npm run test

  # Always reports a status, regardless of whether frontend-lint-and-build
  # actually ran. Set THIS job (not frontend-lint-and-build) as the required
  # status check in branch protection, so PRs that don't touch frontend/**
  # aren't stuck waiting on a check that was never going to report.
  frontend-ci-status:
    needs: [changes, frontend-lint-and-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.changes.outputs.frontend }}" == "true" && "${{ needs.frontend-lint-and-build.result }}" != "success" ]]; then
            echo "Frontend CI failed"
            exit 1
          fi
          echo "OK — frontend unaffected or checks passed"
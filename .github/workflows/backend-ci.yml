name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'

  backend-lint-and-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sento_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sento_ci

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Run migrations against ci postgres
        run: uv run alembic upgrade head

      - name: Run tests
        if: hashFiles('backend/tests/**') != ''
        run: uv run pytest

  # Always reports a status, regardless of whether backend-lint-and-test
  # actually ran. Set THIS job (not backend-lint-and-test) as the required
  # status check in branch protection, so PRs that don't touch backend/**
  # aren't stuck waiting on a check that was never going to report.
  backend-ci-status:
    needs: [changes, backend-lint-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.changes.outputs.backend }}" == "true" && "${{ needs.backend-lint-and-test.result }}" != "success" ]]; then
            echo "Backend CI failed"
            exit 1
          fi
          echo "OK — backend unaffected or checks passed"